         */
        function renderMath(container = document.body) {
            try {
                if (typeof renderMathInElement === 'function' && container) {
                    renderMathInElement(container, {
                        delimiters: [
                            { left: '$$', right: '$$', display: true },
                            { left: '$', right: '$', display: false }
                        ],
                        throwOnError: false
                    });
                }
            } catch (e) {
                console.warn('KaTeX 渲染略過:', e);
            }
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            const colors = {
                success: 'bg-gradient-to-r from-rose-500 to-pink-500 text-white',
                warning: 'bg-amber-500 text-white',
                info: 'bg-slate-800 text-white'
            };
            toast.className = `${colors[type] || colors.info} px-4 py-3 rounded-2xl shadow-lg text-sm font-bold flex items-center gap-2 animate-fade-in pointer-events-auto`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 2800);
        }

        /**
         * ============================================================================
         * 4. 導覽列、側邊欄與進度儀表板渲染
         * ============================================================================
         */
        function getCurrentUnit() {
            return CURRICULUM_DATA.find(u => u.unitId === appState.currentUnitId) || CURRICULUM_DATA[0];
        }

        function filterGrade(grade) {
            appState.currentGradeFilter = grade;
            document.querySelectorAll('.grade-filter-btn').forEach(btn => {
                const isActive = btn.dataset.gradeBtn === grade;
                btn.className = isActive
                    ? 'grade-filter-btn flex-1 lg:flex-none px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-extrabold transition-all bg-white text-rose-600 shadow-xs'
                    : 'grade-filter-btn flex-1 lg:flex-none px-3.5 py-1.5 rounded-xl text-xs sm:text-sm font-bold text-rose-700/70 hover:text-rose-800 transition-all';
            });

            const filtered = grade === 'ALL'
                ? CURRICULUM_DATA
                : CURRICULUM_DATA.filter(u => u.grade === grade);

            if (filtered.length > 0 && !filtered.some(u => u.unitId === appState.currentUnitId)) {
                selectUnit(filtered[0].unitId);
            } else {
                renderSidebar();
            }
        }

        function renderSidebar() {
            const container = document.getElementById('unit-list-container');
            if (!container) return;

            const filtered = appState.currentGradeFilter === 'ALL'
                ? CURRICULUM_DATA
                : CURRICULUM_DATA.filter(u => u.grade === appState.currentGradeFilter);

            container.innerHTML = filtered.map(unit => {
                const isSelected = unit.unitId === appState.currentUnitId;
                const status = appState.unitStatus[unit.unitId] || 'unstarted';
                const statusDot = {
                    unstarted: 'bg-slate-300',
                    learning: 'bg-amber-400 ring-4 ring-amber-100',
                    mastered: 'bg-rose-500 ring-4 ring-pink-100'
                }[status];

                const gradeColors = {
                    '國七': 'bg-pink-100 text-rose-700',
                    '國八': 'bg-fuchsia-100 text-fuchsia-700',
                    '國九': 'bg-purple-100 text-purple-700'
                };

                const scoreObj = appState.quizScores[unit.unitId];

                return `
                    <button onclick="selectUnit('${unit.unitId}')" class="w-full text-left p-4 rounded-2xl border transition-all duration-200 ${
                        isSelected
                            ? 'bg-white border-rose-400 ring-2 ring-rose-400/20 shadow-md shadow-pink-100'
                            : 'bg-white/90 hover:bg-white border-pink-200/70 hover:border-rose-300 shadow-xs'
                    }">
                        <div class="flex items-center justify-between gap-2 mb-1.5">
                            <span class="text-[11px] font-extrabold px-2.5 py-0.5 rounded-lg ${gradeColors[unit.grade] || 'bg-pink-100 text-rose-700'}">
                                ${unit.semester}
                            </span>
                            <div class="flex items-center gap-2">
                                ${scoreObj ? `<span class="text-[11px] font-extrabold text-rose-500">測驗 ${scoreObj.score}分</span>` : ''}
                                <span class="w-2.5 h-2.5 rounded-full ${statusDot}" title="學習狀態"></span>
                            </div>
                        </div>
                        <div class="text-xs text-slate-400 font-semibold mb-0.5">${unit.chapter}</div>
                        <div class="text-sm font-extrabold ${isSelected ? 'text-rose-700' : 'text-slate-800'} leading-snug">
                            ${unit.title}
                        </div>
                    </button>

        }

        function updateDashboardUI() {
            const totalUnits = CURRICULUM_DATA.length;
            const masteredCount = CURRICULUM_DATA.filter(u => appState.unitStatus[u.unitId] === 'mastered').length;
            const pct = Math.round((masteredCount / totalUnits) * 100);

            const progText = document.getElementById('header-progress-text');
            const progBar = document.getElementById('header-progress-bar');
            const accText = document.getElementById('header-accuracy-text');
            const badge = document.getElementById('mistake-count-badge');

            if (progText) progText.textContent = `${masteredCount}/${totalUnits}`;
            if (progBar) progBar.style.width = `${pct}%`;

            const scoredUnits = Object.values(appState.quizScores);
            if (accText) {
                if (scoredUnits.length > 0) {
                    const avg = Math.round(scoredUnits.reduce((acc, cur) => acc + cur.score, 0) / scoredUnits.length);
                    accText.textContent = `${avg}%`;
                } else {
                    accText.textContent = `--%`;
                }
            }

            if (badge) badge.textContent = appState.mistakes.length;
        }

        function toggleMobileSidebar() {
            const sidebar = document.getElementById('curriculum-sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');
            if (!sidebar || !backdrop) return;
            const isClosed = sidebar.classList.contains('-translate-x-full');
            if (isClosed) {
                sidebar.classList.remove('-translate-x-full');
                backdrop.classList.remove('hidden');
            } else {
                sidebar.classList.add('-translate-x-full');
                backdrop.classList.add('hidden');
            }
        }

        /**
         * ============================================================================
         * 5. 單元切換與工作區標題更新
         * ============================================================================
         */
        function selectUnit(unitId) {
            stopAnimTimer();
            stopVoiceSpeech();
            appState.currentUnitId = unitId;
            appState.customYoutubeUrl = null;
            appState.customYoutubeLabel = null;
            if (appState.localVideoUrl) {
                try { URL.revokeObjectURL(appState.localVideoUrl); } catch (e) {}
                appState.localVideoUrl = null;
                appState.localVideoName = null;
            }
            animPlayer.currentSlideIdx = 0;
            animPlayer.elapsedInSlide = 0;
            animPlayer.isPlaying = true;

            if (!appState.unitStatus[unitId] || appState.unitStatus[unitId] === 'unstarted') {
                appState.unitStatus[unitId] = 'learning';
                saveState();
            }

            currentQuizSession = {
                userAnswers: {},
                submitted: false,
                onlyMistakesMode: false
            };

            const sidebar = document.getElementById('curriculum-sidebar');
            if (sidebar && !sidebar.classList.contains('-translate-x-full') && window.innerWidth < 1024) {
                toggleMobileSidebar();
            }

            renderSidebar();
            renderWorkspaceHeader();
            renderWorkspaceContent();
            if (appState.currentTab === 'video') {
                startAnimTimer();
                if (appState.voiceEnabled) speakCurrentSlide();
            }
        }

        function renderWorkspaceHeader() {
            const unit = getCurrentUnit();
            const status = appState.unitStatus[unit.unitId] || 'unstarted';

            document.getElementById('unit-grade-badge').textContent = unit.semester;
            document.getElementById('unit-chapter-badge').textContent = unit.chapter;
            document.getElementById('unit-title').textContent = unit.title;
            document.getElementById('unit-subtitle').textContent = unit.subtitle;

            const statusPill = document.getElementById('unit-status-pill');
            const statusConfig = {
                unstarted: { dot: 'bg-slate-400', text: '未開始', bg: 'bg-slate-100 text-slate-600' },
                learning: { dot: 'bg-amber-500', text: '學習中', bg: 'bg-amber-50 text-amber-700 border border-amber-200' },
                mastered: { dot: 'bg-rose-500', text: '已精熟 💖', bg: 'bg-pink-100 text-rose-700 border border-pink-200' }
            }[status];

            statusPill.className = `px-2.5 py-1 rounded-full text-xs font-bold flex items-center gap-1.5 ${statusConfig.bg}`;
            statusPill.innerHTML = `<span class="w-2 h-2 rounded-full ${statusConfig.dot}"></span> ${statusConfig.text}`;

            const masteryBtn = document.getElementById('toggle-mastery-btn');
            if (status === 'mastered') {
                masteryBtn.className = 'px-4 py-2 rounded-2xl text-xs sm:text-sm font-extrabold bg-gradient-to-r from-rose-500 to-pink-500 text-white shadow-xs hover:opacity-95 transition-all flex items-center gap-1.5 shrink-0';
                masteryBtn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg><span>已達成精熟 💖</span>`;
            } else {
                masteryBtn.className = 'px-4 py-2 rounded-2xl text-xs sm:text-sm font-bold border border-pink-200 hover:border-rose-500 hover:bg-pink-50 text-rose-700 transition-all flex items-center gap-1.5 shrink-0';
                masteryBtn.innerHTML = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg><span>標記為已精熟</span>`;
            }

            const scoreBadge = document.getElementById('quiz-tab-score-badge');
            const scoreObj = appState.quizScores[unit.unitId];
            if (scoreObj) {
                scoreBadge.textContent = `${scoreObj.score}分`;
                scoreBadge.classList.remove('hidden');
            } else {
                scoreBadge.classList.add('hidden');
            }
        }

        function toggleUnitMastery() {
            const unit = getCurrentUnit();
            const current = appState.unitStatus[unit.unitId];
            if (current === 'mastered') {
                appState.unitStatus[unit.unitId] = 'learning';
                showToast('已將單元狀態改回「學習中」', 'info');
            } else {
                appState.unitStatus[unit.unitId] = 'mastered';
                showToast('太棒了！Dora老師為你點亮「已精熟」愛心燈 💖', 'success');
            }
            saveState();
            renderSidebar();
            renderWorkspaceHeader();
        }

        function switchTab(tabName) {
            if (tabName !== 'video') {
                stopAnimTimer();
                stopVoiceSpeech();
            }
            appState.currentTab = tabName;
            document.querySelectorAll('.workspace-tab-btn').forEach(btn => {
                const isActive = btn.dataset.tabBtn === tabName;
                btn.className = isActive
                    ? 'workspace-tab-btn flex items-center gap-2 px-4 py-2.5 rounded-2xl text-sm font-extrabold bg-gradient-to-r from-rose-500 to-pink-500 text-white shadow-sm shadow-pink-200 transition-all shrink-0'
                    : 'workspace-tab-btn flex items-center gap-2 px-4 py-2.5 rounded-2xl text-sm font-bold text-slate-600 hover:bg-pink-50 hover:text-rose-700 transition-all shrink-0';
            });
            renderWorkspaceContent();
            if (tabName === 'video' && animPlayer.isPlaying) {
                startAnimTimer();
                if (appState.voiceEnabled) speakCurrentSlide();
            }
        }

        function renderWorkspaceContent() {
            const container = document.getElementById('workspace-content');
            if (!container) return;
            try {
                container.classList.remove('animate-fade-in');
                void container.offsetWidth;
                container.classList.add('animate-fade-in');

                if (appState.currentTab === 'video') {
                    renderVideoAndNotesTab(container);
                } else if (appState.currentTab === 'examples') {
                    renderExamplesTab(container);
                } else if (appState.currentTab === 'quiz') {
                    renderQuizTab(container);
                }
                renderMath(container);
            } catch (err) {
                console.error('畫面渲染發生異常:', err);
                container.innerHTML = `<div class="p-6 bg-white rounded-2xl border border-rose-200 text-rose-700 font-bold">載入單元內容時發生小狀況，請重新整理頁面。</div>`;
            }
        }

        /**
         * ============================================================================
         * 6. 頁籤 A：Dora老師互動動畫黑板 + 語音朗讀 + 外部YouTube直達卡/本機影片
         * ============================================================================
         */
        function speakCurrentSlide() {
            stopVoiceSpeech();
            if (!appState.voiceEnabled || !('speechSynthesis' in window)) return;
            try {
                const unit = getCurrentUnit();
                const slide = unit.video.slides[animPlayer.currentSlideIdx];
                if (!slide) return;
                const cleanText = slide.subtitleText.replace(/^Dora老師(講解|提醒|小口訣)：/, '');
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'zh-TW';
                utterance.rate = animPlayer.speed;
                utterance.pitch = 1.08;
                const voices = window.speechSynthesis.getVoices();
                const zhVoice = voices.find(v => v.lang.includes('zh-TW') && (v.name.includes('Female') || v.name.includes('女') || v.name.includes('HsiaoChen') || v.name.includes('Meijia')))
                    || voices.find(v => v.lang.includes('zh'));
                if (zhVoice) utterance.voice = zhVoice;
                window.speechSynthesis.speak(utterance);
            } catch (e) {
                console.warn('語音朗讀略過:', e);
            }
        }

        function stopVoiceSpeech() {
            try {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                }
            } catch (e) {}
        }

        function toggleVoiceSpeech() {
            if (!('speechSynthesis' in window)) {
                showToast('你的瀏覽器不支援語音朗讀功能喔 😢', 'warning');
                return;
            }
            appState.voiceEnabled = !appState.voiceEnabled;
            if (appState.voiceEnabled) {
                showToast('🔊 已開啟 Dora老師中文語音朗讀！', 'success');
                if (animPlayer.isPlaying) speakCurrentSlide();
            } else {
                stopVoiceSpeech();
                showToast('🔇 已關閉語音朗讀', 'info');
            }
            renderWorkspaceContent();
        }

        function startAnimTimer() {
            stopAnimTimer();
            animPlayer.timerId = setInterval(() => {
                if (!animPlayer.isPlaying || appState.currentTab !== 'video') return;
                const unit = getCurrentUnit();
                const slides = unit.video.slides;
                const currentSlide = slides[animPlayer.currentSlideIdx];
                animPlayer.elapsedInSlide += 0.25 * animPlayer.speed;

                if (animPlayer.elapsedInSlide >= currentSlide.duration) {
                    animPlayer.elapsedInSlide = 0;
                    if (animPlayer.currentSlideIdx < slides.length - 1) {
                        animPlayer.currentSlideIdx++;
                        renderWorkspaceContent();
                        if (appState.voiceEnabled) speakCurrentSlide();
                    } else {
                        animPlayer.isPlaying = false;
                        stopAnimTimer();
                        stopVoiceSpeech();
                        renderWorkspaceContent();
                        showToast('🌸 Dora老師本單元動畫講解播放完畢！', 'success');
                    }
                } else {
                    const totalDuration = slides.reduce((acc, s) => acc + s.duration, 0);
                    const passedBefore = slides.slice(0, animPlayer.currentSlideIdx).reduce((acc, s) => acc + s.duration, 0);
                    const currentTotalSec = Math.min(totalDuration, Math.floor(passedBefore + animPlayer.elapsedInSlide));
                    const overallPct = Math.min(100, Math.round(((passedBefore + animPlayer.elapsedInSlide) / totalDuration) * 100));

                    const bar = document.getElementById('anim-progress-bar');
                    const timeLabel = document.getElementById('anim-time-label');
                    if (bar) bar.style.width = `${overallPct}%`;
                    if (timeLabel) {
                        timeLabel.textContent = `00:${String(currentTotalSec).padStart(2, '0')} / 00:${String(totalDuration).padStart(2, '0')}`;
                    }
                }
            }, 250);
        }

        function stopAnimTimer() {
            if (animPlayer.timerId) {
                clearInterval(animPlayer.timerId);
                animPlayer.timerId = null;
            }
        }

        function toggleAnimPlay() {
            animPlayer.isPlaying = !animPlayer.isPlaying;
            if (animPlayer.isPlaying) {
                startAnimTimer();
                if (appState.voiceEnabled) speakCurrentSlide();
            } else {
                stopAnimTimer();
                stopVoiceSpeech();
            }
            renderWorkspaceContent();
        }

        function stepAnimSlide(delta) {
            const unit = getCurrentUnit();
            const total = unit.video.slides.length;
            animPlayer.currentSlideIdx = (animPlayer.currentSlideIdx + delta + total) % total;
            animPlayer.elapsedInSlide = 0;
            renderWorkspaceContent();
            if (animPlayer.isPlaying && appState.voiceEnabled) speakCurrentSlide();
        }

        function setAnimSpeed(spd) {
            animPlayer.speed = spd;
            renderWorkspaceContent();
            if (animPlayer.isPlaying && appState.voiceEnabled) speakCurrentSlide();
        }

        function seekAnimProgress(event) {
            const rect = event.currentTarget.getBoundingClientRect();
            const ratio = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
            const unit = getCurrentUnit();
            const slides = unit.video.slides;
            const targetIdx = Math.min(slides.length - 1, Math.floor(ratio * slides.length));
            animPlayer.currentSlideIdx = targetIdx;
            animPlayer.elapsedInSlide = 0;
            renderWorkspaceContent();
            if (animPlayer.isPlaying && appState.voiceEnabled) speakCurrentSlide();

            document.getElementById('quad-val-a').textContent = a === 0 ? '0 (退化為水平線)' : a;
            document.getElementById('quad-val-h').textContent = h;
            document.getElementById('quad-val-k').textContent = k;
            updateQuadraticSVG();
        }

        function resetParabola() {
            appState.parabola = { a: 1, h: 0, k: 0 };
            document.getElementById('slider-a').value = 1;
            document.getElementById('slider-h').value = 0;
            document.getElementById('slider-k').value = 0;
            onParabolaSliderChange();
        }

        function updateQuadraticSVG() {
            const pathEl = document.getElementById('quad-curve-path');
            if (!pathEl) return;

            const { a, h, k } = appState.parabola;
            const scale = 20;
            let d = '';

            for (let px = 0; px <= 300; px += 4) {
                const x = (px - 150) / scale;
                const y = a * Math.pow(x - h, 2) + k;
                const py = 150 - y * scale;
                if (px === 0) {
                    d += `M ${px} ${py}`;
                } else {
                    d += ` L ${px} ${py}`;
                }
            }
            pathEl.setAttribute('d', d);

            const vx = 150 + h * scale;
            const vy = 150 - k * scale;
            document.getElementById('quad-axis-line').setAttribute('x1', vx);
            document.getElementById('quad-axis-line').setAttribute('x2', vx);
            document.getElementById('quad-vertex-dot').setAttribute('cx', vx);
            document.getElementById('quad-vertex-dot').setAttribute('cy', vy);

            const labelEl = document.getElementById('quad-vertex-label');
            labelEl.setAttribute('x', Math.min(245, vx + 8));
            labelEl.setAttribute('y', a >= 0 ? Math.min(290, vy + 16) : Math.max(18, vy - 8));
            labelEl.textContent = `頂點 (${h}, ${k})`;

            const hStr = h === 0 ? 'x²' : (h > 0 ? `(x - ${h})²` : `(x + ${Math.abs(h)})²`);
            const kStr = k === 0 ? '' : (k > 0 ? ` + ${k}` : ` - ${Math.abs(k)}`);
            document.getElementById('quad-formula-display').textContent = `y = ${a}${hStr}${kStr}`;
        }

            const ans = document.getElementById(`ex-answer-${exId}`);
            if (!ans) return;
            ans.classList.toggle('hidden');
            renderMath(ans);
        }

        /**
         * ============================================================================
         * 9. 頁籤 C：單元隨堂測驗系統 + 自動批改 + Dora老師錯題收錄
         * ============================================================================
         */
        function renderQuizTab(container) {
            const unit = getCurrentUnit();
            let quizzesToShow = unit.quizzes;
            if (currentQuizSession.onlyMistakesMode) {
                const unitMistakeIds = appState.mistakes.filter(m => m.unitId === unit.unitId).map(m => m.quizId);
                quizzesToShow = unit.quizzes.filter(q => unitMistakeIds.includes(q.id));
            }

            let resultBannerHtml = '';
            if (currentQuizSession.submitted) {
                let correctCount = 0;
                quizzesToShow.forEach(q => {
                    if (currentQuizSession.userAnswers[q.id] === q.answerIndex) correctCount++;
                });
                const score = Math.round((correctCount / quizzesToShow.length) * 100);
                const stars = score === 100 ? '💖💖💖' : (score >= 75 ? '💖💖' : '💖');
                const feedback = score >= 80
                    ? '太棒了！Dora老師為你拍拍手，你已經完全精熟本單元囉！'
                    : '沒關係再接再厲！答錯的題目已自動收錄進「Dora老師錯題本」，快看看下方詳解吧！';

                resultBannerHtml = `
                    <div class="bg-gradient-to-r from-rose-500 via-pink-500 to-fuchsia-600 rounded-3xl p-6 text-white shadow-lg shadow-pink-200 mb-6 animate-fade-in">
                        <div class="flex flex-wrap items-center justify-between gap-4">
                            <div>
                                <div class="text-xs font-extrabold uppercase tracking-wider text-pink-100 mb-1">Dora老師測驗診斷報告</div>
                                <div class="flex items-baseline gap-3">
                                    <span class="text-4xl font-black">${score} <span class="text-lg font-bold">分</span></span>
                                    <span class="text-xl">${stars}</span>
                                </div>
                                <p class="text-sm text-pink-50 mt-1.5 font-medium">${feedback}</p>
                            </div>
                            <div class="flex flex-wrap gap-2">
                                <button onclick="retryQuiz(false)" class="px-4 py-2.5 rounded-2xl bg-white/20 hover:bg-white/30 text-white text-xs sm:text-sm font-bold transition-all">
                                    全部重測
                                </button>
                                ${correctCount < quizzesToShow.length ? `
                                    <button onclick="retryQuiz(true)" class="px-4 py-2.5 rounded-2xl bg-white text-rose-600 hover:bg-pink-50 text-xs sm:text-sm font-black shadow-sm transition-all">
                                        只重測錯題 (${quizzesToShow.length - correctCount}題)
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }

            const difficultyColors = {
                '基礎': 'bg-pink-100 text-rose-700 border-pink-200',
                '進階': 'bg-fuchsia-100 text-fuchsia-700 border-fuchsia-200',
                '會考素養題': 'bg-purple-100 text-purple-700 border-purple-200'
            };

            const optionLabels = ['A', 'B', 'C', 'D'];

            container.innerHTML = `
                <div>
                    ${resultBannerHtml}

                    <div class="space-y-5">
                        ${quizzesToShow.map((q, qIdx) => {
                            const selectedIdx = currentQuizSession.userAnswers[q.id];
                            const isSubmitted = currentQuizSession.submitted;
                            const isCorrect = selectedIdx === q.answerIndex;

                            return `
                                <div class="bg-white rounded-3xl p-5 sm:p-6 border ${
                                    isSubmitted
                                        ? (isCorrect ? 'border-emerald-300 bg-emerald-50/10' : 'border-rose-400 bg-rose-50/20')
                                        : 'border-pink-200/80'
                                } shadow-xs">
                                    <div class="flex items-center justify-between gap-2 mb-3">
                                        <div class="flex items-center gap-2">
                                            <span class="w-7 h-7 rounded-xl bg-rose-600 text-white text-xs font-black flex items-center justify-center">
                                                ${qIdx + 1}
                                            </span>
                                            <span class="px-2.5 py-0.5 rounded-lg text-xs font-bold border ${difficultyColors[q.difficulty] || 'bg-pink-100 text-rose-700'}">
                                                ${q.difficulty}
                                            </span>
                                        </div>
                                        ${isSubmitted ? (
                                            isCorrect
                                                ? '<span class="px-3 py-1 rounded-full bg-emerald-100 text-emerald-800 text-xs font-extrabold">✔ 答對了</span>'
                                                : '<span class="px-3 py-1 rounded-full bg-rose-100 text-rose-800 text-xs font-extrabold">✘ 再看看詳解</span>'
                                        ) : ''}
                                    </div>

                                    <div class="text-base font-bold text-slate-900 leading-relaxed mb-4">
                                        ${q.question}
                                    </div>

                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                        ${q.options.map((opt, optIdx) => {
                                            let btnStyle = 'border-pink-200/80 hover:border-rose-400 hover:bg-pink-50/50 text-slate-700';
                                            let badgeStyle = 'bg-pink-100/80 text-rose-700';

                                            if (!isSubmitted) {
                                                if (selectedIdx === optIdx) {
                                                    btnStyle = 'border-rose-500 bg-pink-50 text-rose-900 ring-2 ring-rose-500/20';
                                                    badgeStyle = 'bg-rose-600 text-white';
                                                }
                                            } else {
                                                if (optIdx === q.answerIndex) {
                                                    btnStyle = 'border-emerald-500 bg-emerald-50 text-emerald-900 font-bold';
                                                    badgeStyle = 'bg-emerald-600 text-white';
                                                } else if (selectedIdx === optIdx && optIdx !== q.answerIndex) {
                                                    btnStyle = 'border-rose-500 bg-rose-50 text-rose-900';
                                                    badgeStyle = 'bg-rose-600 text-white';
                                                } else {
                                                    btnStyle = 'border-slate-100 bg-slate-50/50 text-slate-400';
                                                }
                                            }

                                            return `
                                                <button
                                                    ${isSubmitted ? 'disabled' : ''}
                                                    onclick="selectQuizOption('${q.id}', ${optIdx})"
                                                    class="p-3.5 rounded-2xl border text-left transition-all flex items-center gap-3 ${btnStyle}">
                                                    <span class="w-7 h-7 rounded-xl text-xs font-black flex items-center justify-center shrink-0 ${badgeStyle}">
                                                        ${optionLabels[optIdx]}
                                                    </span>
                                                    <span class="text-sm font-medium">${opt}</span>
                                                </button>
                                            `;
                                        }).join('')}
                                    </div>

                                    ${isSubmitted ? `
                                        <div class="mt-4 pt-4 border-t border-pink-100">
                                            <div class="bg-pink-50/60 rounded-2xl p-4 border border-pink-200/70 text-sm text-slate-700 leading-relaxed">
                                                <div class="font-black text-xs uppercase tracking-wider mb-1 text-rose-700">
                                                    👩‍🏫 Dora老師詳細解析（正確答案：${optionLabels[q.answerIndex]}）
                                                </div>
                                                <div>${q.explanation}</div>
                                            </div>
                                        </div>
                                    ` : ''}
                                </div>
                            `;
                        }).join('')}
                    </div>

                    ${!currentQuizSession.submitted ? `
                        <div class="mt-6 flex items-center justify-between bg-white p-4 rounded-3xl border border-pink-200 shadow-xs">
                            <span class="text-xs sm:text-sm font-bold text-slate-600">
                                已作答：<strong class="text-rose-600">${Object.keys(currentQuizSession.userAnswers).length}</strong> / ${quizzesToShow.length} 題
                            </span>
                            <button onclick="submitQuiz()" class="px-6 py-3 rounded-2xl bg-gradient-to-r from-rose-500 to-pink-500 hover:from-rose-600 hover:to-pink-600 text-white font-black text-sm shadow-md shadow-pink-200 transition-all">
                                送出答案並批改 ✨
                            </button>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function selectQuizOption(quizId, optIdx) {
            if (currentQuizSession.submitted) return;
            currentQuizSession.userAnswers[quizId] = optIdx;
            renderWorkspaceContent();
        }

        function submitQuiz() {
            const unit = getCurrentUnit();
            let quizzesToCheck = unit.quizzes;
            if (currentQuizSession.onlyMistakesMode) {
                const unitMistakeIds = appState.mistakes.filter(m => m.unitId === unit.unitId).map(m => m.quizId);
                quizzesToCheck = unit.quizzes.filter(q => unitMistakeIds.includes(q.id));
            }

            const unanswered = quizzesToCheck.filter(q => currentQuizSession.userAnswers[q.id] === undefined);
            if (unanswered.length > 0) {
                showToast(`還有 ${unanswered.length} 題尚未作答喔！完成後再交卷吧 🌸`, 'warning');
                return;
            }

            currentQuizSession.submitted = true;

            let correctCount = 0;
            quizzesToCheck.forEach(q => {
                const userAns = currentQuizSession.userAnswers[q.id];
                if (userAns === q.answerIndex) {
                    correctCount++;
                    appState.mistakes = appState.mistakes.filter(m => m.quizId !== q.id);
                } else {
                    const existingIdx = appState.mistakes.findIndex(m => m.quizId === q.id);
                    const mistakeEntry = {
                        unitId: unit.unitId,
                        unitTitle: unit.title,
                        quizId: q.id,
                        difficulty: q.difficulty,
                        question: q.question,
                        options: q.options,
                        answerIndex: q.answerIndex,
                        userSelectedIndex: userAns,
                        explanation: q.explanation
                    };
                    if (existingIdx >= 0) {
                        appState.mistakes[existingIdx] = mistakeEntry;
                    } else {
                        appState.mistakes.unshift(mistakeEntry);
                    }
                }
            });

            if (!currentQuizSession.onlyMistakesMode) {
                const score = Math.round((correctCount / quizzesToCheck.length) * 100);
                appState.quizScores[unit.unitId] = {
                    score,
                    total: quizzesToCheck.length,
                    correct: correctCount
                };
                if (score >= 80) {
                    appState.unitStatus[unit.unitId] = 'mastered';
                    showToast(`測驗得分 ${score} 分！Dora老師為你點亮「已精熟」💖`, 'success');
                } else {
                    showToast(`測驗得分 ${score} 分，錯題已自動收錄進錯題本！`, 'info');
                }
            } else {
                showToast(`錯題重測完成！答對 ${correctCount}/${quizzesToCheck.length} 題`, 'success');
            }

            saveState();
            renderSidebar();
            renderWorkspaceHeader();
            renderWorkspaceContent();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function retryQuiz(onlyMistakes = false) {
            currentQuizSession = {
                userAnswers: {},
                submitted: false,
                onlyMistakesMode: onlyMistakes
            };
            renderWorkspaceContent();
        }

        /**
         * ============================================================================
         * 10. Dora老師專屬錯題本 Modal 互動邏輯
         * ============================================================================
         */
        function openMistakeModal() {
            const modal = document.getElementById('mistake-modal');
            const body = document.getElementById('mistake-modal-body');
            const optionLabels = ['A', 'B', 'C', 'D'];

            if (appState.mistakes.length === 0) {
                body.innerHTML = `
                    <div class="text-center py-12">
                        <div class="w-16 h-16 rounded-full bg-pink-100 text-rose-500 flex items-center justify-center mx-auto mb-3 text-2xl">
                            🌸
                        </div>
                        <h4 class="text-lg font-black text-slate-800">目前沒有任何錯題紀錄！</h4>
                        <p class="text-sm text-slate-500 mt-1">太棒了！只要在單元測驗中答錯題目，Dora老師就會自動幫你整理在這裡。</p>
                    </div>
                `;
            } else {
                body.innerHTML = appState.mistakes.map((m, idx) => `
                    <div class="bg-pink-50/50 rounded-2xl p-4 sm:p-5 border border-pink-200 space-y-3">
                        <div class="flex flex-wrap items-center justify-between gap-2">
                            <span class="text-xs font-extrabold px-2.5 py-1 rounded-xl bg-pink-100 text-rose-800">${m.unitTitle}</span>
                            <button onclick="removeSingleMistake('${m.quizId}')" class="text-xs font-bold text-rose-600 hover:text-rose-700 bg-white px-3 py-1 rounded-xl border border-pink-200 shadow-2xs">
                                ✔ 我已訂正學會（移除）
                            </button>
                        </div>
                        <div class="text-sm sm:text-base font-bold text-slate-900">${idx + 1}. ${m.question}</div>
                        <div class="flex flex-wrap gap-3 text-xs font-bold">
                            <span class="px-2.5 py-1 rounded-xl bg-rose-100 text-rose-800">
                                你的誤選：(${optionLabels[m.userSelectedIndex]}) ${m.options[m.userSelectedIndex]}
                            </span>
                            <span class="px-2.5 py-1 rounded-xl bg-emerald-100 text-emerald-800">
                                正確答案：(${optionLabels[m.answerIndex]}) ${m.options[m.answerIndex]}
                            </span>
                        </div>
                        <div class="bg-white p-3.5 rounded-2xl border border-pink-100 text-xs sm:text-sm text-slate-700 leading-relaxed">
                            <strong class="text-rose-600">👩‍🏫 Dora老師解析：</strong>${m.explanation}
                        </div>
                    </div>
                `).join('');
            }

            modal.classList.remove('hidden');
            renderMath(body);
        }

        function closeMistakeModal() {
            document.getElementById('mistake-modal').classList.add('hidden');
        }

        function removeSingleMistake(quizId) {
            appState.mistakes = appState.mistakes.filter(m => m.quizId !== quizId);
            saveState();
            openMistakeModal();
            showToast('已從錯題本移除該題！繼續加油 💖', 'success');
        }

        function clearAllMistakes() {
            if (appState.mistakes.length === 0) return;
            appState.mistakes = [];
            saveState();
            openMistakeModal();
            showToast('已清空所有錯題紀錄', 'info');
        }

        function resetAllProgress() {
            appState.unitStatus = {};
            appState.quizScores = {};
            appState.mistakes = [];
            saveState();
            selectUnit(CURRICULUM_DATA[0].unitId);
            showToast('已重置所有學習進度與測驗紀錄', 'info');
        }

        /**
         * ============================================================================
         * 11. 應用程式初始化啟動
         * ============================================================================
         */
        function initApp() {
            try {
                loadState();
                updateDashboardUI();
                selectUnit(CURRICULUM_DATA[0].unitId);
            } catch (err) {
                console.error('初始化錯誤:', err);
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initApp);
        } else {
            initApp();
        }
    </script>
</body>
</html>
